spring:
  application:
    name: booking-service

  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
      discovery:
        enabled: true
        service-id: config-server

  profiles:
    active: local
    include: kafka
